name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python dependencies
        run: python -m pip install playwright pillow

      - name: Install Chromium
        run: python -m playwright install --with-deps chromium

      - name: Validate example story strictly
        run: python engine/validate.py stories/example/story.json --strict

      - name: Run unit tests
        run: python -m unittest discover -s tests

      - name: Check example layout
        run: python tools/check_layout.py stories/example/story.json --phone

      - name: Check supported paper mechanics
        run: python tools/check_mechanics.py stories/example/story.json --only S1,S3,S4,S5,S6,S8,S9,F3,F4,F5,F6,T1,T2,T5,B,W,L1,N,I

  firefox-layout:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Playwright
        run: python -m pip install playwright

      - name: Install Firefox
        run: python -m playwright install --with-deps firefox

      - name: Check example layout in Firefox
        run: python tools/check_layout.py stories/example/story.json --browser firefox
