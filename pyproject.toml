[build-system]
requires = ["setuptools>=68,<82"]
build-backend = "setuptools.build_meta"

[project]
name = "hermes-popup-storybook"
version = "1.0.0"
description = "Offline virtual pop-up storybook engine, validator, and QA tools"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
dependencies = []

[project.optional-dependencies]
qa = [
  "playwright>=1.40,<2",
  "Pillow>=10.0,<12",
]
dev = [
  "pytest>=8.0,<10",
]

[project.entry-points."hermes_agent.plugins"]
hermes-popup-storybook = "hermes_popup_storybook"

[tool.setuptools]
packages = [
  "hermes_popup_storybook",
  "hermes_popup_storybook.engine",
  "hermes_popup_storybook.tools",
]
package-dir = {hermes_popup_storybook = "."}

[tool.setuptools.package-data]
hermes_popup_storybook = ["plugin.yaml", "templates/*.md", "templates/*.json", "templates/qa-briefs/*.md"]
"hermes_popup_storybook.engine" = ["*.html", "*.css", "*.js", "library/*.json"]

[tool.pytest.ini_options]
# The repository root is also a Hermes plugin package whose __init__.py uses relative
# imports. Stopping conftest/package discovery at tests/ keeps pytest from importing that
# file under a name taken from the checkout folder, so a plain `pytest` works in any clone.
testpaths = ["tests"]
addopts = "--confcutdir=tests"
markers = [
  "browser: slow integration tests requiring Playwright and installed browsers",
]
