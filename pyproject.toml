[build-system]
requires = ["setuptools>=68,<82"]
build-backend = "setuptools.build_meta"

[project]
name = "hermes-popup-storybook"
version = "1.0.0"
description = "Offline virtual pop-up storybook engine, validator, and QA tools"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
dependencies = []

[project.optional-dependencies]
qa = [
  "playwright>=1.40,<2",
  "Pillow>=10.0,<12",
]
dev = [
  "pytest>=8.0,<10",
]

[tool.setuptools]
packages = ["engine"]
