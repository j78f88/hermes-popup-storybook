name: hermes-popup-storybook
version: 1.0.0
description: Create, validate and build private offline pop-up storybooks.
author: "Pop-up Storybook contributors"
license: MIT
homepage: https://github.com/j78f88/hermes-popup-storybook
tags: [storybook, offline, html]
requires_hermes: ">=0.22.6"
provides_tools:
  - storybook_new
  - storybook_validate
  - storybook_build
provides_hooks: []
requires_env: []
# Disclosure metadata for reviewers; not a sandbox or permission grant.
disclosures:
  storage: >-
    Registered tools read and write only under plugin_data_dir("hermes-popup-storybook"),
    plus read-only bundled templates and engine assets. Stories, reports and HTML
    are local; there is no publishing, telemetry or background process.
  subprocesses:
    default_tools: none
    optional_cli:
      - "tools/_browser.py: built_book runs the Python engine/build.py for JSON input."
      - "tools/build_and_check.py: run_step invokes Python validation, ledger, build, layout and mechanics scripts."
      - "tools/release_check.py: git invokes Git to inspect files and optional history."
      - "Browser QA/export CLI scripts use Playwright, which launches browser child processes."
  network: >-
    No registered tool makes network calls. The unregistered, explicit-use
    tools/visual_qa.py CLI uploads supplied screenshots and briefs to OpenRouter
    (or OPENROUTER_URL) and can incur model charges. It is never imported by register().
  credentials: >-
    Registered tools require and store no credentials. The separate visual_qa.py
    CLI reads OPENROUTER_API_KEY through agent.secret_scope.get_secret, and from the
    process environment only when Hermes is not importable; it opens no .env file. It
    is not a default plugin tool and is not enabled or called by /storybook.
